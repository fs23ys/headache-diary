<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect width="100" height="100" fill="white"/>

  <!-- Starburst hair (radiating from top of head) -->
  <g stroke="#1a1a1a" stroke-width="2.5">
    <line x1="50" y1="33" x2="50" y2="5"/>
    <line x1="50" y1="33" x2="30" y2="10"/>
    <line x1="50" y1="33" x2="14" y2="22"/>
    <line x1="50" y1="33" x2="70" y2="10"/>
    <line x1="50" y1="33" x2="86" y2="22"/>
    <line x1="50" y1="33" x2="12" y2="40"/>
    <line x1="50" y1="33" x2="88" y2="40"/>
  </g>

  <!-- Face circle -->
  <circle cx="50" cy="64" r="31" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Anger marks (upper left and right of face) -->
  <!-- Left ✳ -->
  <g stroke="#1a1a1a" stroke-width="1.8">
    <line x1="19" y1="48" x2="26" y2="48"/>
    <line x1="22.5" y1="44.5" x2="22.5" y2="51.5"/>
    <line x1="20" y1="46" x2="25" y2="51"/>
    <line x1="25" y1="46" x2="20" y2="51"/>
  </g>
  <!-- Right ✳ -->
  <g stroke="#1a1a1a" stroke-width="1.8">
    <line x1="74" y1="48" x2="81" y2="48"/>
    <line x1="77.5" y1="44.5" x2="77.5" y2="51.5"/>
    <line x1="75" y1="46" x2="80" y2="51"/>
    <line x1="80" y1="46" x2="75" y2="51"/>
  </g>

  <!-- Left eye × -->
  <g stroke="#1a1a1a" stroke-width="2.8">
    <line x1="33" y1="55" x2="44" y2="66"/>
    <line x1="44" y1="55" x2="33" y2="66"/>
  </g>

  <!-- Right eye × -->
  <g stroke="#1a1a1a" stroke-width="2.8">
    <line x1="56" y1="55" x2="67" y2="66"/>
    <line x1="67" y1="55" x2="56" y2="66"/>
  </g>

  <!-- Frown -->
  <path d="M37 80 Q50 74 63 80" stroke="#1a1a1a" stroke-width="2.2"/>
</svg>
