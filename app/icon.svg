<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#222" stroke-linecap="round" stroke-linejoin="round">
  <!-- Background white -->
  <rect width="100" height="100" fill="white"/>

  <!-- Spiky hair -->
  <path d="M28 45 L22 22 L33 38 L37 16 L44 35 L50 8 L56 35 L63 16 L67 38 L78 22 L72 45"
        stroke="#222" stroke-width="3" fill="#222"/>

  <!-- Face outline -->
  <ellipse cx="50" cy="65" rx="28" ry="30" fill="white" stroke="#222" stroke-width="3"/>

  <!-- Left eyebrow (angry, tilted) -->
  <path d="M30 52 Q38 47 43 51" stroke="#222" stroke-width="2.5"/>

  <!-- Right eyebrow (angry, tilted) -->
  <path d="M57 51 Q62 47 70 52" stroke="#222" stroke-width="2.5"/>

  <!-- Left eye X -->
  <line x1="31" y1="57" x2="41" y2="66" stroke="#222" stroke-width="2.5"/>
  <line x1="41" y1="57" x2="31" y2="66" stroke="#222" stroke-width="2.5"/>

  <!-- Right eye X -->
  <line x1="59" y1="57" x2="69" y2="66" stroke="#222" stroke-width="2.5"/>
  <line x1="69" y1="57" x2="59" y2="66" stroke="#222" stroke-width="2.5"/>

  <!-- Frown mouth -->
  <path d="M37 82 Q50 76 63 82" stroke="#222" stroke-width="2.5"/>
</svg>
