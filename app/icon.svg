  <path d="M62 49 Q70 44 80 50" stroke="#3D3D3D" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Left eye >< -->
  <line x1="21" y1="57" x2="32" y2="65" stroke="#3D3D3D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="21" y1="65" x2="32" y2="57" stroke="#3D3D3D" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right eye >< -->
